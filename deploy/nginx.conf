server {
    listen 80;
    server_name fabric.innovatingwithcapella.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fabric.innovatingwithcapella.com;

    ssl_certificate /etc/letsencrypt/live/fabric.innovatingwithcapella.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fabric.innovatingwithcapella.com/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kept in step with --timeout in capella-fabric.service. The smaller of
        # the two is the real deadline, and a mismatch is confusing to diagnose:
        # nginx waiting 120s while gunicorn kills the worker at 30 produced a
        # 502 with no traceback on a large model.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
