# Nginx config for the Capella Fabric MCP Server on the *Cartenza* droplet.
#
# The production Capella MCP endpoint for Cartenza members -- the same binary as
# nginx_mcp.conf, with kp-auth installed so begin_connect / connect_code work.
# This is the endpoint the member system prompt should name, so that no member-
# facing URL says "dev".
#
# Add as /etc/nginx/sites-available/capella-mcp
# then: sudo ln -s /etc/nginx/sites-available/capella-mcp /etc/nginx/sites-enabled/
# then: sudo systemctl reload nginx
#
# The certificate must EXIST before this file is installed -- the 443 block
# below names it, so nginx -t fails without it and nginx will not reload. Get
# it first with certbot certonly (see docs), then install this. Installing
# first and running certbot --nginx afterwards also works, but leaves certbot's
# edits in the file rather than this one.
#
# capella.cartenza.ai is already in mcp_server.py's allowed_hosts; a name that
# isn't there 421s every request regardless of what nginx does.

server {
    listen 80;
    server_name capella.cartenza.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name capella.cartenza.ai;

    ssl_certificate     /etc/letsencrypt/live/capella.cartenza.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capella.cartenza.ai/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow long-running fabric generation calls
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Required for streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }
}
