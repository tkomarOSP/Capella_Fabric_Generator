# Nginx config for the Capella Fabric MCP Server on the *Cartenza* droplet.
#
# This is the co-deployed variant (cousin_back_log/note-0086): same binary as
# nginx_mcp.conf, different host, and with kp-auth installed so begin_connect /
# connect_code work. The standalone deployment at mcp.innovatingwithcapella.com
# keeps using nginx_mcp.conf and is unaffected.
#
# Add as /etc/nginx/sites-available/capella-mcp
# then: sudo ln -s /etc/nginx/sites-available/capella-mcp /etc/nginx/sites-enabled/
# then: sudo certbot --nginx -d dev.capella.cartenza.ai
# then: sudo systemctl reload nginx
#
# For production, replace dev.capella.cartenza.ai with capella.cartenza.ai
# throughout. Both names are already in mcp_server.py's allowed_hosts; a name
# that isn't there 421s every request regardless of what nginx does.

server {
    listen 80;
    server_name dev.capella.cartenza.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.capella.cartenza.ai;

    ssl_certificate     /etc/letsencrypt/live/dev.capella.cartenza.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.capella.cartenza.ai/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow long-running fabric generation calls
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Required for streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }
}
