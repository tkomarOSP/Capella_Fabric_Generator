# Nginx config for the Capella Fabric MCP Server
# Add this file as /etc/nginx/sites-available/capella-mcp
# then: sudo ln -s /etc/nginx/sites-available/capella-mcp /etc/nginx/sites-enabled/
# then: sudo certbot --nginx -d mcp.innovatingwithcapella.com
# then: sudo systemctl reload nginx

server {
    listen 80;
    server_name mcp.innovatingwithcapella.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.innovatingwithcapella.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.innovatingwithcapella.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.innovatingwithcapella.com/privkey.pem;

    # MCP Streamable HTTP endpoint
    # The FastMCP server serves all requests at /mcp
    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow long-running fabric generation calls
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Required for streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }
}
